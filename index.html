<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ffffff"><title>Инфографика</title></head>
<body><main>
<p id="load-status" role="status">Загружаем историю турнира…</p>
<div id="workspace" hidden>
<section class="results" aria-label="Результаты по годам">
<div class="toolbar"><div class="period-controls" role="group" aria-label="Период"><span>Период</span><select id="from-year" aria-label="С года"></select><span aria-hidden="true">—</span><select id="to-year" aria-label="По год"></select></div><div class="zoom-controls" role="group" aria-label="Масштаб диаграммы"><button id="zoom-out" type="button" aria-label="Уменьшить диаграмму">−</button><button id="zoom-reset" type="button" title="Вернуть 100%. Alt/Option + колесо или два пальца меняют масштаб диаграммы; двойной клик приближает область до 100%." aria-label="Масштаб 100%. Вернуть 100%">100%</button><button id="zoom-in" type="button" aria-label="Увеличить диаграмму">+</button></div><button id="compact-mode" type="button" aria-pressed="false">Компактно</button><button id="all-rosters-mode" type="button" aria-pressed="false" title="Показать истории всех игроков команды за все годы">Все составы</button><button id="player-filter" class="player-filter" type="button" hidden><span id="player-filter-name"></span><span class="filter-remove" aria-hidden="true">×</span></button></div>

<div id="diagram" class="diagram-scroll" tabindex="0" role="region" aria-label="Диаграмма результатов, доступна прокрутка и масштабирование двумя пальцами"></div></section>
</div>
<footer><p>Сделал <a href="https://t.me/il_sunduev" target="_blank" rel="noopener noreferrer">Илья Сундуев</a><span class="footer-divider" aria-hidden="true"> · </span>Вдохновлено <a href="https://astrofyz.github.io/studchr_flow/" target="_blank" rel="noopener noreferrer">Инфографикой СтудЧР</a></p></footer>
</main><script type="module" src="/src/main.ts"></script></body></html>
